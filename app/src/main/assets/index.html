<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride Weight Loss Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: phone-first single column, bottom tab bar, sheets slide up over content */
  --bg: #F1F3F0; --card: #FFFFFF; --ink: #13201C; --muted: #5C6A65; --line: #DDE3DF; --soft: #E8EDEA;
  --accent: #D9512B; --accent-ink: #FFFFFF; --pine: #1E6B58;
  --good: #1E8A5A; --warn: #B7800A; --bad: #C23E2A;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --c-kcal: #D9512B; --c-pro: #2F6FB3; --c-fib: #23915F; --c-carb: #C2850E; --c-fat: #8360C9;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1F22; --card: #2A2B2F; --ink: #ECEDEF; --muted: #A4A7AD; --line: #3A3C41; --soft: #34363B;
    --accent: #FF7A50; --accent-ink: #1A0D08; --pine: #6CC9AE; --good: #4CC98D; --warn: #E7B13C; --bad: #FF7660;
    --c-kcal: #FF7A50; --c-pro: #6FA8E8; --c-fib: #4CC98D; --c-carb: #E7B13C; --c-fat: #B39AF0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1F22; --card: #2A2B2F; --ink: #ECEDEF; --muted: #A4A7AD; --line: #3A3C41; --soft: #34363B;
  --accent: #FF7A50; --accent-ink: #1A0D08; --pine: #6CC9AE; --good: #4CC98D; --warn: #E7B13C; --bad: #FF7660;
  --c-kcal: #FF7A50; --c-pro: #6FA8E8; --c-fib: #4CC98D; --c-carb: #E7B13C; --c-fat: #B39AF0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; } h2 { font-size: 22px; } h3 { font-size: 18px; }
p { margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 12px; }
a { color: var(--pine); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 10px; }
.brand { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
.brand b { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.card.flat { border: 0; background: var(--soft); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 0 2px; }
.section-title h2 { font-size: 20px; }

.btn { appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--pine); padding: 8px 10px; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.iconbtn { appearance: none; border: 1px solid var(--line); background: var(--card); width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg, .btn svg { width: 20px; height: 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.chip.accent { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.chip.pine { background: color-mix(in srgb, var(--pine) 14%, transparent); color: var(--pine); }
.seg { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 8px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=search], input[type=time], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 11px 12px; font-size: 16px; color: var(--ink); }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 1px; flex: none; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
.opt .t { font-weight: 700; } .opt .d { color: var(--muted); font-size: 13px; }

/* tabs */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
.tabbar .inner { display: flex; width: 100%; max-width: 560px; }
.tabbar button { flex: 1; border: 0; background: none; padding: 9px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--accent); }

/* date strip */
.datebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datebar .d { font-weight: 700; text-align: center; flex: 1; }

/* home hero */
.hero { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .c .big { font-size: 34px; line-height: 1; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pine); border-radius: 99px; }
.bar.over > i { background: var(--warn); }
.macro { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border: 1px solid var(--line); background: var(--card); border-radius: var(--r); padding: 11px 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 96px; position: relative; }
.tile .lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .val { font-size: 22px; line-height: 1.1; }
.tile .sub { font-size: 12px; color: var(--muted); }
.tile.hit { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.tile.hit::after { content: ""; position: absolute; top: 10px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
.sparks { display: inline-flex; align-items: center; gap: 5px; background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); border-radius: 999px; padding: 5px 11px 5px 8px; font-weight: 700; border: 0; cursor: pointer; }
.sparks svg { width: 18px; height: 18px; }

/* diary */
.meal { padding: 0; overflow: hidden; }
.meal .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.item:last-child { border-bottom: 0; }
.item .nm { font-weight: 600; } .item .meta { font-size: 12px; color: var(--muted); }
.item .kc { font-family: var(--display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.list { display: flex; flex-direction: column; }
.list .item { border-left: 0; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(8,14,12,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 94%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .2s ease-out; }
.sheet.full { height: 94%; }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet .sh { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet .sh h2 { flex: 1; font-size: 22px; }
.sheet .sb { padding: 14px 16px 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }
.sheet .sf { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; z-index: 60; max-width: 90%; font-size: 14px; }
.banner { background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: 13px; }

.nd { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
.nd i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--body); }
.hunger { display: flex; flex-direction: column; gap: 8px; }

.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }

.photo-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.photo-pair img, .ph { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: 13px; }

.splash { height: 100vh; display: grid; place-content: center; text-align: center; gap: 8px; }
.steps-dots { display: flex; gap: 6px; } .steps-dots i { height: 4px; flex: 1; border-radius: 4px; background: var(--line); } .steps-dots i.on { background: var(--accent); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv .v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.daypills { display: flex; gap: 6px; } .daypills button { flex: 1; border: 1.5px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 0; font-weight: 700; cursor: pointer; }
.daypills button.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.exercise { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.exercise:last-child { border-bottom: 0; }
.exercise .n { font-family: var(--display); font-size: 20px; color: var(--accent); font-weight: 700; }
.timer { font-size: 64px; line-height: 1; text-align: center; }
.empty { text-align: center; padding: 22px 10px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.hscroll > * { flex: none; }
.rcard { width: 210px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.rcard .art { height: 92px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-size: 30px; font-weight: 700; color: #fff; }
.thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: contain; background: #fff; border: 1px solid var(--line); flex: none; }
.hero-img { width: 100%; max-height: 220px; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid var(--line); padding: 8px; }

/* ---- UI refresh ---- */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); }
.tabs.scroll { overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 8px 0 10px; font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--muted); cursor: pointer; position: relative; white-space: nowrap; }
.tabs.scroll button { font-family: var(--body); font-size: 15px; font-weight: 600; }
.tabs button.on { color: var(--ink); }
.tabs button.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 3px; background: var(--accent); }
.pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 5px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.pill .pl { background: var(--c); color: #fff; font-size: 11px; font-weight: 700; border-radius: 7px; padding: 2px 0; width: 100%; text-align: center; }
:root[data-theme="dark"] .pill .pl { color: #1E1F22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill .pl { color: #1E1F22; } }
.pill .pv { font-size: 19px; line-height: 1.1; margin-top: 2px; }
.pill .pv small { font-size: 12px; margin-left: 1px; }
.pill .pt { font-size: 11px; color: var(--muted); white-space: nowrap; }
.pill .pb { display: block; width: 80%; height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-top: 2px; }
.pill .pb b { display: block; height: 100%; background: var(--c); border-radius: 4px; }
.ndhead { display: flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; text-align: right; }
.ndhead .t { display: flex; flex-direction: column; line-height: 1.1; } .ndhead .t span { font-size: 11px; color: var(--muted); }
.ndhead .face { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; }
.meal .head { border-bottom: 1px solid var(--line); }
.mtitle { display: flex; align-items: center; gap: 4px; border: 0; background: none; cursor: pointer; padding: 0; color: var(--ink); }
.qty { background: var(--soft); border-radius: 6px; padding: 1px 6px; font-weight: 600; }
.ph-thumb { display: grid; place-items: center; font-weight: 700; color: var(--muted); background: var(--soft) !important; }
.addrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-top: 1px solid var(--line); }
.addrow > button.grow { display: flex; align-items: center; gap: 10px; border: 0; background: none; font-weight: 700; font-size: 15px; cursor: pointer; padding: 6px 0; text-align: left; color: var(--ink); }
.addrow .plus { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.addrow .plus svg { width: 16px; height: 16px; stroke-width: 3; }
.hero2 { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 14px; }
.hero2 .eyebrow { font-size: 13px; color: var(--muted); }
.hero2 h2 { font-size: 24px; }
.hero2 .big { font-size: 44px; line-height: 1; }
.hero2.perfect { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 14%, var(--card)), var(--card)); }
.badge { width: 150px; height: 150px; }
.burst { width: 190px; height: 190px; }
.burst .cf { animation: pop .9s ease-out both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; } }
.calcard { display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; width: 100%; }
.bar.thick { height: 12px; }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.tick.on { background: var(--c); border-color: var(--c); color: #fff; }
.tick svg { width: 15px; height: 15px; stroke-width: 3; }
.celebrate { position: fixed; inset: 0; z-index: 70; background: rgba(8,14,12,.55); display: grid; place-items: center; padding: 20px; animation: up .25s ease-out; }
.celebrate .cbox { background: var(--card); border-radius: 22px; padding: 18px 20px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 360px; width: 100%; }
.celebrate h1 { font-size: 36px; }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rc { padding: 0; overflow: hidden; text-align: left; cursor: pointer; display: flex; flex-direction: column; }
.rimg { aspect-ratio: 4 / 3; overflow: hidden; background: var(--soft); }
.rimg.big { border-radius: 14px; aspect-ratio: 16 / 9; }
.rart { width: 100%; height: 100%; display: block; object-fit: cover; }
.rimg.big .rart { height: 100%; }
.rbody { padding: 9px 10px 11px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.rname { font-weight: 700; font-size: 14px; line-height: 1.25; }
:root[data-theme="dark"] .rart { filter: brightness(.86) saturate(.95); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rart { filter: brightness(.86) saturate(.95); } }

</style>
</head>

<div id="app"></div>
<div id="tabs"></div>
<div id="sheet"></div>
<script>
/* ---------- Built-in data: generic foods (per 100g/ml, approximate UK values) ---------- */
// [name, kcal, protein, carbs, sugars, fat, saturates, fibre, salt, category, servingG, servingLabel, unit]
const FOOD_ROWS = [

  ["Greek yoghurt, 0% fat",57,10.3,3.6,3.6,0.2,0.1,0,0.1,"dairy",150,"pot (150g)"],
  ["Greek-style yoghurt, full fat",133,5.6,5.4,5.4,10,6.8,0,0.1,"dairy",150,"bowl (150g)"],
  ["Skyr, plain",63,11,4,4,0.2,0.1,0,0.1,"dairy",150,"pot (150g)"],
  ["Cottage cheese, low fat",72,12,3.3,3.3,1.5,0.9,0,0.6,"dairy",100,"half tub (100g)"],
  ["Cheddar cheese",416,25,0.1,0.1,34.9,21.7,0,1.8,"dairy",30,"matchbox piece (30g)"],
  ["Cheddar, reduced fat",314,27,0.1,0.1,22,14,0,1.8,"dairy",30,"matchbox piece (30g)"],
  ["Mozzarella",254,18.4,1,1,19.5,13.5,0,0.5,"dairy",60,"half ball (60g)"],

const Store = {
  mode: "local", db: null, uid: null, cache: {}, timers: {}, chains: {}, failed: false, assets: null, sample: null,
  async init() {
    let db = null, user = null;
    const timeout = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]);
    try {
      if (window.claude && window.claude.use) {
        [db, user] = await timeout(Promise.all([window.claude.use("db"), window.claude.use("user")]), 10000) || [null, null];
        window.claude.use("sample").then((s) => { this.sample = s; if (s && this.ready) render(); }).catch(() => {});
        window.claude.use("assets").then((a) => { this.assets = a; }).catch(() => {});
      }
    } catch { db = null; }
    if (db && user) {
      try {
        const id = await timeout(user.id(), 8000);
        if (id) {
          this.db = db; this.uid = id;
          const snap = await timeout(db.collection("data/users/" + id).get(), 10000);
          if (snap) {
            snap.docs.forEach((d) => { this.cache[d.id] = d.data(); });
            this.mode = "cloud";
            // first visit on cloud: bring across anything saved on this device
            if (snap.empty) { for (const k of LS.keys()) { const v = LS.get(k); if (v) { this.cache[k] = v; this.write(k); } } }
            return;
          }
        }
      } catch { /* fall through to local */ }
    }
    this.mode = "local"; this.db = null;
    for (const k of LS.keys()) this.cache[k] = LS.get(k);
  },
  get(k, def) { return this.cache[k] ?? def; },
  set(k, v) { this.cache[k] = v; this.write(k); },
  del(k) { delete this.cache[k]; this.write(k, true); },
  keys(prefix) { return Object.keys(this.cache).filter((k) => k.startsWith(prefix)); },
  write(k, del) {
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => {
      const val = this.cache[k];
      if (this.mode !== "cloud") { if (!LS.set(k, del ? null : val)) toast("Couldn't save on this device. Storage may be full."); return; }
      const ref = this.db.collection("data/users/" + this.uid).doc(k);
      const run = async () => {
        for (let attempt = 0; attempt < 2; attempt++) {
          try { if (del || val == null) await ref.delete(); else await ref.set(JSON.parse(JSON.stringify(val))); this.failed = false; return; }
          catch (e) {
            if (e && e.code === "unavailable" && attempt === 0) { await new Promise((r) => setTimeout(r, 800 + Math.random() * 800)); continue; }
            this.failed = true; LS.set(k, del ? null : val);
            toast(e && e.code === "quota_exceeded" ? "Storage is full. Delete some old progress photos." : "Couldn't save to your account. Kept a copy on this device.");
            return;
          }
        }
      };
      this.chains[k] = (this.chains[k] || Promise.resolve()).then(run);
    }, 500);
  },
};

/* =================== Nutrition maths =================== */
const ZERO = () => ({ kcal: 0, p: 0, c: 0, s: 0, f: 0, sf: 0, fi: 0, salt: 0, spen: 0 });
function scaled(per100, g, natural) {
  const k = g / 100, o = ZERO();
  for (const key of ["kcal", "p", "c", "s", "f", "sf", "fi", "salt"]) o[key] = (per100[key] || 0) * k;
  o.spen = natural ? 0 : o.s;
  return o;
}
function sumN(list) { const o = ZERO(); for (const n of list) for (const k in o) o[k] += n[k] || 0; return o; }
const itemN = (it) => scaled(it.per100, it.g, it.natural);
// Nutrient Score: own heuristic. Protein & fibre per 100 kcal up, added sugar & saturated fat per 100 kcal down.
function ndScore(n) {
  if (!n || n.kcal < 5) return null;
  const per = 100 / n.kcal;
  return n.p * per * 6 + n.fi * per * 14 - n.spen * per * 1.2 - n.sf * per * 3 - n.salt * per * 4;
}
const ND_BANDS = [[80, "Excellent", "var(--good)"], [45, "Good", "var(--pine)"], [25, "OK", "var(--warn)"], [10, "Poor", "#D9822B"], [-Infinity, "Very low", "var(--bad)"]];

function currentKg() {

  for (let i = keys.length - 1; i >= 0; i--) { const d = day(keys[i]); if (d.weight && d.weight.kg) return d.weight.kg; }
  return P() ? P().startKg : 80;

function recommendPlan(p) {
  const bf = p.bf || (p.sex === "male" ? 25 : 32);
  if (p.goal === "maintain") return "maintain";
  if (p.goal === "build") return bf > (p.sex === "male" ? 18 : 28) ? "recomp" : "bulk";
  if (p.goal === "tone") return "recomp";
  if (p.meds && p.meds.on) return "glp1";
  return bf >= (p.sex === "male" ? 25 : 33) ? "deficit_intense" : "deficit_moderate";
}
function calcTargets(p, planKey = p.plan, kg = currentKg()) {
  const plan = PLANS[planKey] || PLANS.deficit_moderate;
  const age = ageFrom(p.dob);
  const bmr = 10 * kg + 6.25 * (p.heightCm || 170) - 5 * age + (p.sex === "male" ? 5 : -161);
  const act = ACTIVITY[p.activity] || ACTIVITY.light;
  const wdays = p.workout && p.workout.mode === "yes" ? (p.workout.days || []).length : 0;
  const tdee = bmr * (act.f + wdays * 0.02);
  let kcal = tdee * (1 + plan.adj);
  const floor = p.sex === "male" ? 1500 : 1200;
  kcal = Math.max(floor, Math.round(kcal / 10) * 10);
  const bf = (p.bf || (p.sex === "male" ? 25 : 32)) / 100;
  const lean = kg * (1 - bf);
  let protein = Math.round(clamp(lean * plan.protein, 90, 230) / 5) * 5;
  const fat = Math.round((kcal * 0.28) / 9);
  const carbs = Math.max(50, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const fibre = kcal < 1500 ? 25 : 30;
  const water = Math.round(clamp(kg * 30, 1800, 3000) / 100) * 100;
  return { kcal, protein, fat, carbs, fibre, water, steps: act.steps, workouts: wdays, tdee: Math.round(tdee), bmr: Math.round(bmr) };
}

function chart(points, o = {}) {

  const vals = points.map((p) => p.y).filter((v) => v != null);
  if (!vals.length) return `<div class="empty small">No data for this period yet.</div>`;
  const extra = [o.target, ...(o.avg || []).map((a) => a.y)].filter((v) => v != null);

  const padv = (hi - lo) * 0.1; hi += padv; if (!o.bar) lo -= padv;
  const x = (i) => L + (points.length === 1 ? (W - L - R) / 2 : (i * (W - L - R)) / (points.length - 1));
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "chart")}">`;
  ticks.forEach((t) => { s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${o.fmt ? o.fmt(t) : fmt(t)}</text>`; });
  if (o.target != null) s += `<line x1="${L}" x2="${W - R}" y1="${y(o.target)}" y2="${y(o.target)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  if (o.bar) {
    const bw = Math.max(2, Math.min(18, ((W - L - R) / points.length) * 0.65));
    points.forEach((p, i) => { if (p.y == null) return; const over = o.target != null && p.y > o.target * (o.overTol || 1.05); s += `<rect x="${x(i) - bw / 2}" y="${y(p.y)}" width="${bw}" height="${Math.max(1, y(lo) - y(p.y))}" rx="2" fill="${over ? "var(--warn)" : "var(--pine)"}" opacity="${p.y >= (o.target || 0) * 0.9 || !o.target ? 1 : 0.55}"/>`; });
  } else {
    const pts = points.map((p, i) => (p.y == null ? null : [x(i), y(p.y)])).filter(Boolean);
    if (o.avg) { const ap = o.avg.map((p, i) => (p.y == null ? null : `${x(i)},${y(p.y)}`)).filter(Boolean); s += `<polyline points="${ap.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`; }
    if (pts.length > 1) s += `<path d="M${pts[0][0]},${y(lo)} L${pts.map((p) => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${y(lo)} Z" fill="var(--pine)" opacity=".08"/>`;
    s += `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="var(--pine)" stroke-width="${o.avg ? 1.2 : 2}" opacity="${o.avg ? 0.6 : 1}"/>`;
    pts.forEach((p, i) => { if (points.length <= 40 || i === pts.length - 1) s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 4 : 2}" fill="var(--pine)"/>`; });

}

function ring(pct, color) { const c = 2 * Math.PI * 54; return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--soft)" stroke-width="11"/><circle cx="60" cy="60" r="54" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(pct, 0, 1))}"/></svg>`; }

function calorieHero(e) {

}

function closeSheet() { const s = UI.sheets.pop(); if (s && SH[s.kind].cleanup) SH[s.kind].cleanup(s); renderSheet(); if (!UI.sheets.length) rerender(); }
function closeAll() { while (UI.sheets.length) { const s = UI.sheets.pop(); if (SH[s.kind].cleanup) SH[s.kind].cleanup(s); } renderSheet(); rerender(); }
function below(kind) { for (let i = UI.sheets.length - 2; i >= 0; i--) if (UI.sheets[i].kind === kind) return UI.sheets[i]; return null; }

/* ----- logging helpers ----- */
function addItem(date, item) {
  const d = day(date); d.food.push(item); setDay(date, d);
  const l = lib(); l.recent = [{ ...item, meal: undefined }, ...l.recent.filter((r) => r.name !== item.name)].slice(0, 40); setLib(l);
}
function foodFromGeneric(f) { return { name: f.name, per100: f.n, natural: f.natural, unit: f.unit, serv: f.serv, src: "generic", fid: f.id, cat: f.cat }; }
function foodFromMine(f) { const serv = []; if (f.servG) serv.push([+f.servG, "1 serving"]); if (f.size) serv.push([+f.size, `pack (${f.size}${f.unit || "g"})`]); return { name: f.name, brand: f.brand, per100: f.per100, natural: false, unit: f.unit || "g", serv, src: "mine", fid: f.id, source: f.source, barcode: f.barcode, img: f.img || "", imgS: f.imgS || f.img || "" }; }
function recipeCookedG(r) { if (r.pot && r.pot.use && r.pot.full > r.pot.empty) return r.pot.full - r.pot.empty; if (r.cookedG > 0) return +r.cookedG; return r.ingredients.reduce((a, i) => a + i.g, 0); }
function foodFromRecipe(r) {
  const tot = recipeTotals(r), cooked = recipeCookedG(r) || 1, per100 = {};
  for (const k of ["kcal", "p", "c", "s", "f", "sf", "fi", "salt"]) per100[k] = (tot[k] / cooked) * 100;
  // carry added-sugar share across so the Nutrient Score stays fair
  const natural = tot.s > 0 ? tot.spen / tot.s < 0.5 : true;
  const serv = r.mode === "single" ? [[cooked, "whole recipe"]] : [[cooked / (r.servings || 1), "1 serving"]];
  return { name: r.name, brand: "My recipe", per100, natural, unit: "g", serv, src: "recipe", fid: r.id };
}
function foodFromCurated(r) {
  const tot = recipeTotals(r), raw = r.ing.reduce((a, [, g]) => a + g, 0), per100 = {};
  for (const k of ["kcal", "p", "c", "s", "f", "sf", "fi", "salt"]) per100[k] = (tot[k] / raw) * 100;
  return { name: r.name, brand: "Stride recipe", per100, natural: tot.s > 0 ? tot.spen / tot.s < 0.5 : true, unit: "g", serv: [[raw / r.serves, "1 portion"]], src: "curated", fid: r.id };
}
function searchFoods(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const words = q.split(/\s+/), l = lib();
  const match = (s) => { s = s.toLowerCase(); return words.every((w) => s.includes(w)); };
  const out = [];
  l.foods.forEach((f) => { if (match(f.name + " " + (f.brand || "") + " " + (f.barcode || ""))) out.push({ src: "u", id: f.id, f: foodFromMine(f) }); });
  l.recipes.filter((r) => !r.draft).forEach((r) => { if (match(r.name)) out.push({ src: "r", id: r.id, f: foodFromRecipe(r) }); });
  RECIPES.forEach((r) => { if (match(r.name)) out.push({ src: "c", id: r.id, f: foodFromCurated(r) }); });
  FOODS.forEach((f) => { if (match(f.name + " " + f.cat)) out.push({ src: "g", id: f.id, f: foodFromGeneric(f) }); });
  return out.slice(0, 60);
}
const safeImg = (u) => (/^https:\/\/[a-z0-9.-]*openfoodfacts\.(org|net)\//i.test(u || "") ? u : "");
function thumb(f) { const u = safeImg(f.imgS || f.img); return u ? `<img class="thumb" src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">` : ""; }
function resultRow(r, extra = "") {
  const f = r.f, s = f.serv && f.serv[0], n = s ? scaled(f.per100, s[0]) : f.per100;
  const badge = { off: '<span class="chip">Open Food Facts</span>', u: f.source === "off" ? '<span class="chip">Saved product</span>' : '<span class="chip warn">My food</span>', r: '<span class="chip pine">My recipe</span>', c: '<span class="chip pine">Recipe</span>', g: "", recent: "" }[r.src] || "";
  return `<button class="item" data-a="pickFood" data-src="${r.src}" data-id="${esc(r.id)}" ${extra}>${thumb(f)}<div class="grow"><div class="nm">${esc(f.name)}</div><div class="meta">${s ? esc(s[1]) : "100" + f.unit} · ${fmt(n.kcal)} kcal · P ${r1(n.p)}g</div></div>${badge}</button>`;
}

  title: "Nutrition",
  body(s) {
    const seg = `<div class="seg"><button class="${s.tab === "day" ? "on" : ""}" data-a="set" data-f="tab" data-v="day">${niceDate(s.date)}</button><button class="${s.tab === "week" ? "on" : ""}" data-a="set" data-f="tab" data-v="week">Last 7 days</button></div>`;
    if (s.tab === "day") {
      const d = day(s.date), t = dayTargets(s.date), n = sumN(d.food.map(itemN));
      const byMeal = MEALS.map(([k, l]) => { const mn = sumN(d.food.filter((x) => x.meal === k).map(itemN)); return mn.kcal ? `<div class="row between small"><span>${l}</span><span class="row"><span class="num" style="font-size:14px">${fmt(mn.kcal)} kcal</span>${ndBadge(mn)}</span></div>` : ""; }).join("");
      const top = (key, label, unit) => { const arr = d.food.map((it) => ({ it, v: itemN(it)[key] })).sort((a, b) => b.v - a.v).slice(0, 3).filter((x) => x.v > 0); return arr.length ? `<div><div class="small" style="font-weight:700;margin-bottom:4px">${label}</div>${arr.map((x) => `<div class="row between small"><span class="grow">${esc(x.it.name)}</span><span class="num" style="font-size:14px">${r1(x.v)}${unit}</span></div>`).join("")}</div>` : ""; };
      const sc = ndScore(n), b = ndBand(sc);
      const proteinTip = n.p < t.protein * 0.95, fibreTip = n.fi < t.fibre * 0.95;
      return `${seg}<div class="card stack" style="gap:8px"><div class="row between"><h3>Nutrient Score</h3>${ndBadge(n)}</div><p class="small muted">${b ? `Today your food has ${b.label === "OK" ? "an OK" : b.label.toLowerCase() === "excellent" ? "an excellent" : "a " + b.label.toLowerCase()} amount of nutrition for its calories.` : "Add food to see your score."}</p>${byMeal}</div>
      <div class="card stack" style="gap:8px"><h3>Targets</h3>${macroRow("Calories", n.kcal, t.kcal, "")}${macroRow("Protein", n.p, t.protein)}${macroRow("Fibre", n.fi, t.fibre)}${macroRow("Carbs", n.c, t.carbs)}${macroRow("Fat", n.f, t.fat)}
      <div class="kv small" style="margin-top:4px"><span>Sugars</span><span class="v">${r1(n.s)}g</span><span>Saturated fat</span><span class="v">${r1(n.sf)}g</span><span>Salt</span><span class="v">${r1(n.salt)}g <span class="muted">/ 6g max</span></span></div></div>
      ${d.food.length ? `<div class="card stack">${top("kcal", "Most calories", " kcal")}${top("p", "Most protein", "g")}${top("fi", "Most fibre", "g")}</div>` : ""}
      ${proteinTip || fibreTip ? `<div class="card stack" style="gap:8px"><h3>Top up ideas</h3>${proteinTip ? `<button class="btn sm" data-a="ideas" data-v="protein">High-protein foods</button>` : ""}${fibreTip ? `<button class="btn sm" data-a="ideas" data-v="fibre">High-fibre foods</button>` : ""}</div>` : ""}`;
    }
    const keys = Array.from({ length: 7 }, (_, i) => addDays(s.date, i - 6)), logged = keys.filter((k) => day(k).food.length);
    const tot = sumN(logged.map((k) => sumN(day(k).food.map(itemN)))), c = logged.length || 1, t = P().targets;
    const avg = (x) => x / c;
    return `${seg}<div class="card stack" style="gap:8px"><div class="row between"><h3>Daily averages</h3><span class="small muted">${logged.length} of 7 days logged</span></div>
      ${macroRow("Calories", avg(tot.kcal), t.kcal, "")}${macroRow("Protein", avg(tot.p), t.protein)}${macroRow("Fibre", avg(tot.fi), t.fibre)}${macroRow("Carbs", avg(tot.c), t.carbs)}${macroRow("Fat", avg(tot.f), t.fat)}
      <div class="row between"><span class="small">Week's Nutrient Score</span>${ndBadge(tot)}</div></div>
      <div class="card stack" style="gap:6px"><h3>By day</h3>${keys.map((k) => { const n = sumN(day(k).food.map(itemN)); return `<div class="row between small"><span style="width:70px">${DAYS[dow(k)]} ${shortDate(k)}</span><div class="bar grow ${n.kcal > dayTargets(k).kcal * 1.05 ? "over" : ""}"><i style="width:${clamp((n.kcal / dayTargets(k).kcal) * 100, 0, 100)}%"></i></div><span class="num" style="font-size:14px;width:60px;text-align:right">${n.kcal ? fmt(n.kcal) : "–"}</span></div>`; }).join("")}</div>
      <p class="tiny muted">Focus on your weekly average. Over and under days balance out.</p>`;
  },
};
on("ideas", (e) => {
  const key = e.v === "protein" ? "p" : "fi";
  const list = FOODS.filter((f) => f.n.kcal > 0 && (e.v === "protein" ? isHighProtein(f.n) : isHighFibre(f.n) || (f.n.fi / f.n.kcal) * 100 >= 3)).sort((a, b) => b.n[key] / b.n.kcal - a.n[key] / a.n.kcal).slice(0, 12);
  openSheet("ideasList", { list: list.map((f) => f.id), kind2: e.v });
});
SH.ideasList = {
  title: (s) => (s.kind2 === "protein" ? "High-protein foods" : "High-fibre foods"),
  body: (s) => `<p class="small muted">Most ${s.kind2} for the fewest calories. Tap one to add it.</p><div class="card list" style="padding:0">${s.list.map((id) => resultRow({ src: "g", id, f: foodFromGeneric(FOODS.find((f) => f.id === id)) })).join("")}</div>`,
};

/* ----- Trackers ----- */
SH.logWeight = {
  init(s) { const d = day(s.date), w = d.weight; const u = wUnit(); s.unit = u; if (w && w.kg) { if (u === "st") { const lb = w.kg * 2.20462; s.st = Math.floor(lb / 14); s.lb = r1(lb - s.st * 14); } else s.val = showWnum(w.kg, u); s.note = w.note || ""; s.period = !!w.period; } },
  title: "Add weight",
  body(s) {
    const p = P();
    return `<p class="small muted">${niceDate(s.date)}. Weigh in the morning after the toilet, before eating or drinking.</p>
    ${s.unit === "st" ? `<div class="grid2"><label class="field">Stone<input type="number" inputmode="numeric" id="lw-st" data-s="st" value="${esc(s.st ?? "")}"></label><label class="field">Pounds<input type="number" inputmode="decimal" id="lw-lb" data-s="lb" value="${esc(s.lb ?? "")}"></label></div>` : `<label class="field">Weight (${s.unit})<input type="number" inputmode="decimal" step="0.1" id="lw-val" data-s="val" value="${esc(s.val ?? "")}" placeholder="${s.unit === "kg" ? "e.g. 82.4" : "e.g. 181.6"}"></label>`}
    <label class="field">Note<input type="text" id="lw-note" data-s="note" value="${esc(s.note || "")}" placeholder="Optional, e.g. late takeaway last night"></label>
    ${p.sex === "female" ? `<label class="check"><input type="checkbox" id="lw-period" data-s="period" ${s.period ? "checked" : ""}> I'm on my period. Periods can cause temporary weight changes, and this helps you spot the pattern.</label>` : ""}`;
  },
  foot: (s) => `${day(s.date).weight ? `<button class="btn danger" data-a="delWeight">Delete</button>` : ""}<button class="btn primary grow" data-a="saveWeight">Save weight</button>`,
};
on("saveWeight", () => {
  const s = topS(); let kg;
  if (s.unit === "st") kg = ((+s.st || 0) * 14 + (+s.lb || 0)) * LB; else kg = s.unit === "lb" ? +s.val * LB : +s.val;
  if (!(kg > 30 && kg < 320)) return toast("Enter a valid weight.");
  const d = day(s.date); d.weight = { kg: Math.round(kg * 100) / 100, note: (s.note || "").trim(), period: !!s.period }; setDay(s.date, d); toast("Weight saved"); closeAll();
});
on("delWeight", () => { const s = topS(), d = day(s.date); d.weight = null; setDay(s.date, d); toast("Weight deleted"); closeAll(); });

SH.logWater = {
  init(s) { s.ml = day(s.date).water || 0; },
  title: "Water",
  body: (s) => `<div style="text-align:center"><span class="num" style="font-size:52px" id="lwa-val">${fmt(s.ml)}</span> <span class="muted">ml</span><div class="small muted">Target ${fmt(dayTargets(s.date).water)} ml. Aim for at least 1,600 ml.</div></div>
    <label class="field">Slide to set<input type="range" id="lwa-range" min="0" max="5000" step="50" data-s="ml" data-live value="${s.ml}" style="accent-color:var(--accent)"></label>
    <div class="grid3">${[250, 330, 500].map((v) => `<button class="btn" data-a="addWater" data-v="${v}">+${v} ml</button>`).join("")}</div>`,
  live(s) { $("#lwa-val").textContent = fmt(s.ml); },
  foot: () => `<button class="btn primary block" data-a="saveWater">Save</button>`,
};
on("addWater", (e) => { const s = topS(); s.ml = clamp(+s.ml + +e.v, 0, 5000); $("#lwa-range").value = s.ml; SH.logWater.live(s); });
on("saveWater", () => { const s = topS(), d = day(s.date); d.water = +s.ml; setDay(s.date, d); toast("Water saved"); closeAll(); });

SH.logSteps = {
  init(s) { s.steps = day(s.date).steps ?? ""; if (HC.ok()) { s.syncing = true; HC.sync([s.date], () => { s.syncing = false; s.steps = day(s.date).steps ?? ""; if (topS() === s) refresh(); }); } },
  title: "Steps",
  body: (s) => {
    const d = day(s.date), src = d.stepsSrc === "hc";
    let hc = "";
    if (HC.native()) {
      const st = HC.status();
      hc = HC.ok() ? `<div class="card stack" style="gap:6px"><div class="row between"><strong>Health Connect</strong><span class="chip good">Connected</span></div><p class="small muted">${s.syncing ? "Syncing your steps…" : src ? "Steps sync automatically each time you open Stride." : "No steps found in Health Connect for this day yet."}</p><div class="row"><button class="btn sm" data-a="hcSyncNow">Sync now</button><button class="btn sm ghost" data-a="hcManage">Manage</button><button class="btn sm ghost danger" data-a="hcOff">Turn off</button></div></div>`
        : `<div class="card stack" style="gap:6px"><strong>Get steps automatically</strong><p class="small muted">${st === "available" ? "Connect Health Connect to sync steps from your phone, watch or fitness apps such as Samsung Health, Fitbit, Garmin and Google Fit." : st === "update" ? "Health Connect needs updating from the Play Store before Stride can read your steps." : "Install Health Connect from the Play Store to sync steps from your phone and watch."}</p><button class="btn sm primary" data-a="hcConnect">${st === "available" ? "Connect Health Connect" : st === "update" ? "Update Health Connect" : "Get Health Connect"}</button></div>`;
    }
    return `${hc}<p class="small muted">${HC.ok() ? "Or enter a total by hand." : "Copy today's total from your phone's health app or your watch."} Target ${fmt(dayTargets(s.date).steps)} steps.</p><label class="field">Steps<input type="number" inputmode="numeric" id="ls-steps" data-s="steps" value="${esc(s.steps)}"></label>${HC.native() ? "" : `<p class="tiny muted">Automatic syncing from Health Connect works in the Stride Android app.</p>`}`;
  },
  foot: (s) => `${day(s.date).steps != null ? `<button class="btn danger" data-a="delSteps">Delete</button>` : ""}<button class="btn primary grow" data-a="saveSteps">Save steps</button>`,
};
on("saveSteps", () => { const s = topS(), v = +s.steps; if (!(v >= 0 && v < 100000) || s.steps === "") return toast("Enter a step count."); const d = day(s.date); if (d.steps !== r0(v)) d.stepsSrc = "manual"; d.steps = r0(v); setDay(s.date, d); toast("Steps saved"); closeAll(); });
on("delSteps", () => { const s = topS(), d = day(s.date); d.steps = null; setDay(s.date, d); closeAll(); });

const HUNGER = [[1, "Starving", "I'm starving, even after eating all my calories."], [2, "Peckish", "I'm peckish, even after eating all my calories."], [3, "Satisfied", "Not too full and not hungry."], [4, "Full", "Full but not uncomfortable."], [5, "Stuffed", "I'm struggling to finish my calories."]];
SH.logHunger = {
  init(s) { s.h = day(s.date).hunger; },
  title: "Hunger rating",
  body: (s) => `<p class="small muted">How hungry did you feel overall today? Best done in the evening.</p><div class="hunger">${HUNGER.map(([v, t, d]) => `<button class="opt ${s.h === v ? "on" : ""}" data-a="set" data-f="h" data-v="${v}" data-num="1"><div><div class="t">${t}</div><div class="d">${d}</div></div></button>`).join("")}</div>`,
  foot: (s) => `${day(s.date).hunger ? `<button class="btn danger" data-a="delHunger">Delete</button>` : ""}<button class="btn primary grow" data-a="saveHunger" ${s.h ? "" : "disabled"}>Save</button>`,
};
on("saveHunger", () => { const s = topS(), d = day(s.date); d.hunger = s.h; setDay(s.date, d); toast("Hunger rating saved"); closeAll(); });
on("delHunger", () => { const s = topS(), d = day(s.date); d.hunger = null; setDay(s.date, d); closeAll(); });

/* ----- Workouts ----- */
SH.workout = {
  full: true,
  title: (s) => WORKOUTS.find((w) => w.id === s.id).name,
  body(s) {
    const w = WORKOUTS.find((x) => x.id === s.id);
    return `<div class="row wrap" style="gap:6px"><span class="chip">${w.mins} min</span><span class="chip">${w.level}</span><span class="chip">${w.focus}</span><span class="chip">${w.place === "gym" ? "Gym" : "Home"}</span></div>
    <div class="card"><h3>Included exercises</h3>${w.ex.map((x, i) => `<div class="exercise"><span class="n">${i + 1}</span><div><div style="font-weight:700">${esc(x[0])}</div><div class="small muted">${x[1]} ${x[1] === 1 ? "set" : "sets"} × ${esc(x[2])}${x[3] ? ` · ${x[3]}s rest` : ""}</div><div class="small">${esc(x[4])}</div><a class="tiny" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x[0] + " exercise form")}" target="_blank" rel="noopener">Watch how on YouTube</a></div></div>`).join("")}</div>
    <p class="tiny muted">Warm up for 5 minutes first. Stop if anything hurts and check with a doctor if you have a health condition.</p>`;
  },
  foot: (s) => `<button class="btn primary block" data-a="startWorkout" data-id="${s.id}">Start workout</button>`,
};
let PLAYER_T = null;
on("startWorkout", (e) => openSheet("player", { id: e.id, i: 0, set: 1, phase: "work", started: Date.now() }));
SH.player = {
  full: true,
  init(s) { SH.player.prime(s); },
  prime(s) { const ex = WORKOUTS.find((w) => w.id === s.id).ex[s.i]; const m = /^(\d+)s/.exec(ex[2]); s.secs = s.phase === "rest" ? ex[3] : m ? +m[1] : null; s.running = s.phase === "rest"; },
  title: (s) => WORKOUTS.find((w) => w.id === s.id).name,
  body(s) {
    const w = WORKOUTS.find((x) => x.id === s.id), ex = w.ex[s.i], next = w.ex[s.i + 1];
    return `<div class="small muted">Exercise ${s.i + 1} of ${w.ex.length} · Set ${s.set} of ${ex[1]}</div>
    <h1>${s.phase === "rest" ? "Rest" : esc(ex[0])}</h1>${s.phase === "rest" ? `<p class="muted">Next: ${esc(ex[0])}, set ${s.set}</p>` : `<p>${esc(ex[4])}</p>`}
    <div class="card stack" style="align-items:center;gap:6px">${s.secs != null ? `<div class="timer num" id="pl-timer">${s.secs}</div><div class="small muted">seconds</div><button class="btn sm" data-a="plToggle">${s.running ? "Pause" : "Start timer"}</button>` : `<div class="timer num">${esc(ex[2])}</div><div class="small muted">reps</div>`}</div>
    ${next && s.phase !== "rest" ? `<div class="small muted">Up next: ${esc(next[0])}</div>` : ""}
    <a class="small" href="https://www.youtube.com/results?search_query=${encodeURIComponent(ex[0] + " exercise form")}" target="_blank" rel="noopener">Watch how on YouTube</a>`;
  },
  after(s) { clearInterval(PLAYER_T); if (s.running && s.secs != null) PLAYER_T = setInterval(() => { s.secs--; const el = $("#pl-timer"); if (el) el.textContent = Math.max(0, s.secs); if (s.secs <= 0) { clearInterval(PLAYER_T); try { navigator.vibrate && navigator.vibrate(300); } catch {} A.plNext(); } }, 1000); },
  cleanup() { clearInterval(PLAYER_T); },
  foot: (s) => `<button class="btn" data-a="plPrev" ${s.i === 0 && s.set === 1 && s.phase === "work" ? "disabled" : ""}>Previous</button><button class="btn primary grow" data-a="plNext">${s.phase === "rest" ? "Skip rest" : "Done, next"}</button><button class="btn" data-a="plFinish">Finish</button>`,
};
on("plToggle", () => { const s = topS(); s.running = !s.running; refresh(); });
on("plNext", () => {
  const s = topS(); if (!s || s.kind !== "player") return; const w = WORKOUTS.find((x) => x.id === s.id), ex = w.ex[s.i];
  if (s.phase === "work") { if (ex[3] && !(s.i === w.ex.length - 1 && s.set >= ex[1])) { s.phase = "rest"; } else if (s.set < ex[1]) s.set++; else if (s.i < w.ex.length - 1) { s.i++; s.set = 1; } else return A.plFinish(); }
  else { s.phase = "work"; if (s.set < ex[1]) s.set++; else if (s.i < w.ex.length - 1) { s.i++; s.set = 1; } else return A.plFinish(); }
  SH.player.prime(s); if (s.phase === "work") s.running = false; refresh();
});
on("plPrev", () => { const s = topS(); s.phase = "work"; if (s.set > 1) s.set--; else if (s.i > 0) { s.i--; s.set = 1; } SH.player.prime(s); s.running = false; refresh(); });
on("plFinish", () => { const s = topS(), w = WORKOUTS.find((x) => x.id === s.id); clearInterval(PLAYER_T); const mins = Math.max(1, Math.round((Date.now() - s.started) / 60000)); openSheet("logWorkout", { name: w.name, min: Math.max(mins, 5), date: todayKey(), wid: w.id }); });
SH.logWorkout = {
  init(s) { s.name = s.name || ""; s.min = s.min || 30; },
  title: "Log a workout",
  body: (s) => `<label class="field">Workout name*<input type="text" id="lwo-name" data-s="name" value="${esc(s.name)}" placeholder="e.g. 5k run, spin class"></label><label class="field">How long did it take? (minutes)*<input type="number" inputmode="numeric" id="lwo-min" data-s="min" value="${esc(s.min)}"></label><label class="field">Date<input type="date" id="lwo-date" data-s="date" value="${s.date}"></label>`,
  foot: () => `<button class="btn primary block" data-a="saveWorkout">Mark as complete</button>`,
};
on("saveWorkout", () => { const s = topS(), name = (s.name || "").trim(), min = +s.min; if (!name || !(min > 0 && min < 600)) return toast("Add a name and a length in minutes."); const d = day(s.date); d.workouts.push({ name, min: r0(min), wid: s.wid || null }); setDay(s.date, d); toast("Workout complete. Sparks earned!"); closeAll(); });

SH.workoutPrefs = {
  init(s) { const w = P().workout; s.mode = w.mode; s.days = [...(w.days || [])]; s.place = w.place || "home"; },
  title: "Workout preferences",
  body: (s) => `<div class="stack">${[["yes", "Yes, I want to work out"], ["no", "I don't want to do workouts"], ["cannot", "I'm physically unable to work out"]].map(([k, l]) => `<button class="opt ${s.mode === k ? "on" : ""}" data-a="set" data-f="mode" data-v="${k}"><div class="t">${l}</div></button>`).join("")}</div>
    ${s.mode === "yes" ? `<h3>Workout days</h3><p class="small muted">Choose between 2 and 6.</p><div class="daypills">${DAYS.map((n, i) => `<button class="${s.days.includes(i) ? "on" : ""}" data-a="prefDay" data-v="${i}" aria-pressed="${s.days.includes(i)}">${n[0]}</button>`).join("")}</div><div class="seg"><button class="${s.place === "home" ? "on" : ""}" data-a="set" data-f="place" data-v="home">Home</button><button class="${s.place === "gym" ? "on" : ""}" data-a="set" data-f="place" data-v="gym">Gym</button></div>` : ""}`,
  foot: () => `<button class="btn primary block" data-a="savePrefs">Save</button>`,
};
on("prefDay", (e) => { const s = topS(), i = +e.v; s.days = s.days.includes(i) ? s.days.filter((x) => x !== i) : [...s.days, i].sort(); refresh(); });
on("savePrefs", () => { const s = topS(); if (s.mode === "yes" && (s.days.length < 2 || s.days.length > 6)) return toast("Choose between 2 and 6 workout days."); const p = P(); p.workout = { mode: s.mode, days: s.days, place: s.place }; recalc(p); toast("Workout preferences saved. Targets updated."); closeAll(); });

    <div class="card"><div class="small muted">Nutrition per portion (serves ${r.serves})</div><div class="grid3" style="margin-top:6px"><div><div class="num" style="font-size:22px">${fmt(n.kcal * per)}</div><div class="tiny muted">kcal</div></div><div><div class="num" style="font-size:22px">${r0(n.p * per)}g</div><div class="tiny muted">protein</div></div><div><div class="num" style="font-size:22px">${r1(n.fi * per)}g</div><div class="tiny muted">fibre</div></div></div><div style="margin-top:6px">${ndBadge(n)}</div></div>
    <div class="card stack" style="gap:6px"><h3>Ingredients for ${r.serves}</h3>${r.ing.map(([nm, g]) => `<div class="row between small"><span>${esc(nm)}</span><span class="num" style="font-size:14px">${g}${(FOOD_BY_NAME[nm] || {}).unit || "g"}</span></div>`).join("")}${r.extra ? `<div class="small muted">Plus: ${esc(r.extra)}</div>` : ""}</div>
    <div class="card stack" style="gap:8px"><h3>Method</h3>${r.steps.map((t, i) => `<div><div class="small" style="font-weight:700;color:var(--accent)">Step ${i + 1}</div><div>${esc(t)}</div></div>`).join("")}</div>
    <div class="card stack" style="gap:8px"><h3>I'm eating this</h3><label class="field">Portions<input type="number" inputmode="decimal" step="0.5" id="rv-por" data-s="portions" value="${s.portions}"></label><div class="seg">${MEALS.map(([k, l]) => `<button class="${s.meal === k ? "on" : ""}" data-a="set" data-f="meal" data-v="${k}">${l}</button>`).join("")}</div></div>`;
  },

function recalc(p, keepCustom) {
  const t = calcTargets(p);
  if (keepCustom && p.customTargets && p.targets) { p.targets = { ...t, kcal: p.targets.kcal, protein: p.targets.protein, fibre: p.targets.fibre, water: p.targets.water, steps: p.targets.steps }; const r = rebalance(p.targets); p.targets.carbs = r.carbs; p.targets.fat = r.fat; }
  else { p.targets = t; p.customTargets = false; }
  setP(p);
}
function rebalance(t) { const fat = Math.round((t.kcal * 0.28) / 9); return { fat, carbs: Math.max(50, Math.round((t.kcal - t.protein * 4 - fat * 9) / 4)) }; }

}

      ${e.res.map((r) => `<button class="item" ${action[r.key]}><span class="tick ${r.hit ? "on" : ""}" style="--c:var(--c-${TARGET_ICON[r.key]})">${r.hit ? ic("check") : ""}</span><div class="grow"><div class="nm">${r.label}</div><div class="meta">${value(r)}</div></div>${r.sparks ? `<span class="small ${r.hit ? "" : "muted"}" style="font-weight:700">+${r.sparks}</span>` : ""}</button>`).join("")}
    </section>
    <div class="grid2"><button class="btn primary" data-a="sheet" data-v="addFood" data-meal="${defaultMeal()}">${ic("plus")} Log food</button><button class="btn" data-a="sheet" data-v="scan" data-meal="${defaultMeal()}">${ic("scan")} Scan barcode</button></div>
    ${storageBanner()}`;
    if (isToday) setTimeout(() => maybeCelebrate(e), 60);
  }
  if (UI.homeTab === "progress") body = viewProgress();
  return `${topbar()}<main class="stack">${seg}${body}</main>`;
}
function maybeCelebrate(e) {
  if (!e.perfect || UI.sheets.length || $("#celebrate")) return;
  const k = todayKey(), cel = Store.get("celebrated", {}); if (cel[k]) return;
  const keep = Object.keys(cel).sort().slice(-20), next = {}; keep.forEach((x) => (next[x] = 1)); next[k] = 1; Store.set("celebrated", next);
  const el = document.createElement("div"); el.id = "celebrate"; el.className = "celebrate"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Perfect day");
  el.innerHTML = `<div class="cbox">${burstSvg()}<h1>Perfect day!</h1><p class="muted">You hit all ${e.total} of your targets today.</p><div class="chip accent" style="font-size:15px;padding:6px 14px">${ic("spark", 'style="width:16px;height:16px"')} +${e.sparks} sparks</div><button class="btn primary block" data-a="closeCelebrate">Brilliant</button></div>`;
  document.body.appendChild(el);
  try { navigator.vibrate && navigator.vibrate([60, 40, 90]); } catch {}
}
on("closeCelebrate", () => { const el = $("#celebrate"); if (el) el.remove(); });

/* ----- Diary ----- */
function viewDiary() {
  const e = evalDay(UI.date), d = e.d;
  const meals = MEALS.map(([k, label]) => {
    const items = d.food.map((it, i) => ({ it, i })).filter((x) => x.it.meal === k);
    const n = sumN(items.map((x) => itemN(x.it)));
    return `<section class="card meal" aria-label="${label}">
      <div class="head"><button class="mtitle" ${items.length ? `data-a="sheet" data-v="mealMenu" data-meal="${k}"` : `data-a="sheet" data-v="addFood" data-meal="${k}"`}><h3>${label}</h3>${ic("right", 'style="width:18px;height:18px"')}</button><div style="text-align:right"><div class="num" style="font-size:22px;line-height:1">${fmt(n.kcal)}</div><div class="tiny muted">Total kcal</div></div></div>
      ${items.map(({ it, i }) => { const nn = itemN(it); return `<button class="item" data-a="sheet" data-v="foodDetail" data-idx="${i}">${thumb(it) || `<span class="thumb ph-thumb" aria-hidden="true">${esc((it.name || "?")[0])}</span>`}<div class="grow"><div class="nm">${esc(it.name)}</div><div class="meta"><span class="qty">${r1(it.g)}${it.unit || "g"}</span>${it.brand ? " " + esc(it.brand) : ""}</div></div><span class="small muted" style="white-space:nowrap">${fmt(nn.kcal)} kcal</span></button>`; }).join("")}
      <div class="addrow"><button class="grow" data-a="sheet" data-v="addFood" data-meal="${k}" aria-label="Add food to ${label}"><span class="plus">${ic("plus")}</span>Add food</button>${items.length ? `<button class="iconbtn" style="width:34px;height:34px;border:0;background:var(--soft)" data-a="sheet" data-v="mealMenu" data-meal="${k}" aria-label="${label} options">${ic("more")}</button>` : ""}</div>
    </section>`;
  }).join("");
  return `<header class="topbar"><div class="brand">Food Diary</div>${ndHeader(e.n)}</header><main class="stack">${datebar()}
    ${macroPills(e.n, e.t)}
    <button class="card row between" style="cursor:pointer;text-align:left" data-a="sheet" data-v="nutrition"><span class="row">${ic("diary", 'style="width:20px;height:20px;color:var(--pine)"')}<strong>View nutrition</strong></span>${ic("right", 'style="width:18px;height:18px;color:var(--muted)"')}</button>
    ${meals}
    <div class="grid2"><button class="btn" data-a="sheet" data-v="quickAdd" data-meal="${defaultMeal()}">Quick add calories</button><button class="btn" data-a="sheet" data-v="copyDay">Copy a day</button></div></main>`;
}

/* ----- Drawn recipe pictures ----- */
const ART = [
  [/chicken|turkey/i, "#E9BC8B", "chunk"], [/beef|mince|steak|kebab/i, "#7E4430", "crumb"], [/salmon/i, "#F08C6A", "slab"], [/cod|fish/i, "#F4E6D0", "slab"],
  [/prawn/i, "#F4A07A", "prawn"], [/egg/i, "#FFF6E0", "egg"], [/lentil|dal/i, "#E39A3B", "mash"], [/chickpea/i, "#E5BF78", "pea"], [/kidney/i, "#8E2B2B", "bean"],
  [/black bean/i, "#2E2622", "bean"], [/baked bean/i, "#C9562E", "bean"], [/rice|couscous|quinoa/i, "#F6F1E4", "grain"], [/pasta|noodle/i, "#EFD186", "noodle"],
  [/spinach|salad|leaves/i, "#3F8E48", "leaf"], [/broccoli/i, "#2F7D3B", "floret"], [/green bean/i, "#4C9A42", "stick"], [/peas|edamame|mixed veg/i, "#69B34C", "pea"],
  [/tomato|pepper/i, "#D9442E", "chunk"], [/sweetcorn/i, "#F2C94C", "pea"], [/sweet potato/i, "#E7893A", "wedge"], [/potato|chips/i, "#E9C77F", "wedge"],
  [/yoghurt|skyr|cottage|cream cheese/i, "#FFFDF6", "dollop"], [/feta|mozzarella|halloumi/i, "#FFF7E3", "chunk"], [/cheddar|cheese/i, "#F2C14E", "shred"],
  [/berr|blueberr/i, "#4B3F9E", "pea"], [/strawberr|raspberr/i, "#C8314A", "pea"], [/banana/i, "#F3D36B", "coin"], [/oat|granola|cereal|biscuit/i, "#D7BE94", "grain"],
  [/chocolate/i, "#55372A", "drizzle"], [/almond|nut|peanut/i, "#C48E5A", "crumb"], [/honey|jam/i, "#E7AE3F", "drizzle"], [/chia/i, "#3A3A3A", "crumb"],
  [/wrap|tortilla|bagel|bread|bun|crumpet/i, "#E2B77C", "bread"], [/onion/i, "#EAD3E2", "ring"], [/carrot/i, "#EE8A2E", "coin"], [/mushroom/i, "#B39478", "chunk"],
  [/courgette|cucumber/i, "#8DBF5A", "coin"], [/milk|oat drink/i, "#FFFDF8", "dollop"], [/tofu|mycoprotein/i, "#EFE3C4", "chunk"],
];
function artFor(name) { for (const [re, col, shape] of ART) if (re.test(name)) return { col, shape }; return null; }
function seeded(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
const BGS = ["#F6D9C8", "#D7E8D5", "#F4E3B5", "#DCD9F2", "#CFE2EE", "#F2D2DC"];
function recipeArt(id, ingredients, idx = 0) {
  const rnd = seeded(id), W = 200, H = 150, cx = 100, cy = 82, rx = 74, ry = 46;
  const parts = ingredients.map(([n, g]) => ({ n, g, a: artFor(n) })).filter((x) => x.a && !/oil/i.test(x.n)).sort((a, b) => b.g - a.g);
  const bread = parts.find((x) => x.a.shape === "bread");
  const base = parts.find((x) => ["grain", "noodle", "mash", "wedge"].includes(x.a.shape)) || parts[0];
  const isBowl = !bread && !!parts.find((x) => /lentil|chickpea|chilli|curry|noodle|oat|yoghurt|skyr/i.test(x.n));
  let s = `<svg viewBox="0 0 ${W} ${H}" class="rart" aria-hidden="true"><rect width="${W}" height="${H}" fill="${BGS[idx % BGS.length]}"/>`;
  for (let i = 0; i < 7; i++) s += `<circle cx="${rnd() * W}" cy="${rnd() * H}" r="${2 + rnd() * 3}" fill="#fff" opacity=".35"/>`;
  s += `<ellipse cx="${cx}" cy="${cy + 12}" rx="${rx + 8}" ry="${ry + 4}" fill="#000" opacity=".1"/>`;
  if (isBowl) s += `<path d="M${cx - rx - 6},${cy - 6} Q${cx},${cy + ry + 54} ${cx + rx + 6},${cy - 6}Z" fill="#FFFFFF"/><path d="M${cx - rx - 6},${cy - 6} Q${cx},${cy + ry + 54} ${cx + rx + 6},${cy - 6}" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="3"/>`;
  s += `<ellipse cx="${cx}" cy="${cy - 6}" rx="${rx + 6}" ry="${ry - 4}" fill="#FFFFFF"/><ellipse cx="${cx}" cy="${cy - 6}" rx="${rx - 4}" ry="${ry - 12}" fill="#F3F1EC"/>`;
  const inside = () => { const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 0.8; return [cx + Math.cos(a) * (rx - 14) * r, cy - 6 + Math.sin(a) * (ry - 18) * r]; };
  const title = (ingredients.title || "").toLowerCase();
  if (bread || /omelette/.test(title)) {
    const fill = parts.filter((x) => x !== bread && x.a.shape !== "bread");
    if (/wrap|fajita/.test(title)) {
      [[-22, -14, -12], [24, 2, 10]].forEach(([dx, dy, rot]) => {
        const x0 = cx + dx, y0 = cy - 10 + dy;
        s += `<g transform="rotate(${rot} ${x0} ${y0})"><rect x="${x0 - 44}" y="${y0 - 13}" width="88" height="26" rx="13" fill="${bread ? bread.a.col : "#E2B77C"}"/><rect x="${x0 - 44}" y="${y0 - 13}" width="88" height="26" rx="13" fill="none" stroke="#000" stroke-opacity=".08"/>`;
        s += `<ellipse cx="${x0 + 40}" cy="${y0}" rx="9" ry="13" fill="#F3E2BE"/>`;
        fill.slice(0, 4).forEach((f, i) => { s += `<circle cx="${x0 + 38 + (i % 2) * 4}" cy="${y0 - 6 + i * 4}" r="3.2" fill="${f.a.col}"/>`; });
        for (let i = 0; i < 6; i++) s += `<circle cx="${x0 - 34 + i * 12}" cy="${y0 - 4 + (i % 2) * 7}" r="1.6" fill="#B07A3E" opacity=".6"/>`;
        s += `</g>`;
      });
    } else if (/burger|bagel|bun|stack/.test(title)) {
      const y = cy - 6, col = bread ? bread.a.col : "#D9A35E", patty = fill.find((f) => /turkey|beef|chicken|mince/i.test(f.n));
      s += `<path d="M${cx - 44},${y + 10} h88 a10,10 0 0 1 -10,12 h-68 a10,10 0 0 1 -10,-12z" fill="${col}"/>`;
      s += `<path d="M${cx - 50},${y + 6} q8,-8 16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none" stroke="#5FAE4E" stroke-width="7" stroke-linecap="round"/>`;
      s += `<rect x="${cx - 46}" y="${y - 8}" width="92" height="13" rx="6" fill="${patty ? "#8A5636" : "#8A5636"}"/>`;
      s += `<path d="M${cx - 44},${y - 9} L${cx + 44},${y - 9} L${cx + 30},${y - 1} L${cx - 30},${y - 1}Z" fill="#F2C14E"/>`;
      s += `<rect x="${cx - 40}" y="${y - 16}" width="80" height="7" rx="3" fill="#D9442E"/>`;
      s += `<path d="M${cx - 48},${y - 16} q48,-52 96,0z" fill="${col}"/>`;
      for (let i = 0; i < 9; i++) s += `<ellipse cx="${cx - 30 + rnd() * 60}" cy="${y - 30 + rnd() * 10}" rx="2" ry="1.1" fill="#FFF4D6"/>`;
    } else {
      // omelette with a slice of toast
      s += `<rect x="${cx + 8}" y="${cy - 34}" width="44" height="40" rx="8" fill="#C98E50" transform="rotate(8 ${cx + 30} ${cy - 14})"/><rect x="${cx + 12}" y="${cy - 30}" width="36" height="32" rx="6" fill="#E9C389" transform="rotate(8 ${cx + 30} ${cy - 14})"/>`;
      s += `<path d="M${cx - 58},${cy - 4} a34,26 0 0 1 68,0z" fill="#F6CF4A"/><path d="M${cx - 58},${cy - 4} h68" stroke="#E2B530" stroke-width="3"/>`;
      fill.forEach((f) => { for (let i = 0; i < 6; i++) s += `<circle cx="${cx - 50 + rnd() * 52}" cy="${cy - 22 + rnd() * 14}" r="2.4" fill="${f.a.col}"/>`; });
    }
  } else {
    if (base) s += `<ellipse cx="${cx}" cy="${cy - 6}" rx="${rx - 10}" ry="${ry - 17}" fill="${base.a.col}"/>`;
    if (base && base.a.shape === "grain") for (let i = 0; i < 60; i++) { const [x, y] = inside(); s += `<ellipse cx="${x}" cy="${y}" rx="2.4" ry="1.2" fill="#fff" opacity=".55" transform="rotate(${rnd() * 180} ${x} ${y})"/>`; }
    if (base && base.a.shape === "noodle") for (let i = 0; i < 9; i++) { const [x, y] = inside(); s += `<path d="M${x - 18},${y} q6,-6 12,0 t12,0 t12,0" fill="none" stroke="#D9B661" stroke-width="2.4" stroke-linecap="round"/>`; }
    const total = parts.reduce((a, x) => a + x.g, 0) || 1;
    parts.filter((x) => x !== base).forEach((x) => {
      const n = Math.max(3, Math.min(16, Math.round((x.g / total) * 40)));
      for (let i = 0; i < n; i++) {
        const [px, py] = inside(), c = x.a.col, rot = rnd() * 360;
        switch (x.a.shape) {
          case "chunk": s += `<rect x="${px - 6}" y="${py - 5}" width="${10 + rnd() * 4}" height="${8 + rnd() * 3}" rx="3" fill="${c}" stroke="#000" stroke-opacity=".08" transform="rotate(${rot} ${px} ${py})"/>`; break;
          case "crumb": s += `<circle cx="${px}" cy="${py}" r="${2 + rnd() * 2.5}" fill="${c}"/>`; break;
          case "slab": if (i < 2) s += `<rect x="${px - 18}" y="${py - 9}" width="36" height="18" rx="6" fill="${c}"/><path d="M${px - 10},${py - 7} l4,14 M${px},${py - 8} l4,15 M${px + 9},${py - 7} l3,13" stroke="#fff" stroke-opacity=".6" stroke-width="1.6"/>`; break;
          case "prawn": s += `<path d="M${px - 6},${py} a6,6 0 1,1 10,4" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" transform="rotate(${rot} ${px} ${py})"/>`; break;
          case "egg": if (i < 3) s += `<ellipse cx="${px}" cy="${py}" rx="13" ry="10" fill="${c}"/><circle cx="${px + 1}" cy="${py}" r="5" fill="#F2B31F"/>`; break;
          case "pea": case "bean": s += `<ellipse cx="${px}" cy="${py}" rx="${x.a.shape === "bean" ? 4.5 : 3.2}" ry="3" fill="${c}" transform="rotate(${rot} ${px} ${py})"/>`; break;
          case "leaf": s += `<path d="M${px},${py} q7,-9 14,0 q-7,7 -14,0z" fill="${c}" transform="rotate(${rot} ${px} ${py})"/>`; break;
          case "floret": s += `<circle cx="${px}" cy="${py}" r="5" fill="${c}"/><circle cx="${px + 4}" cy="${py - 3}" r="4" fill="${c}"/><rect x="${px}" y="${py + 2}" width="3" height="6" fill="#8CBF6A"/>`; break;
          case "stick": s += `<rect x="${px - 9}" y="${py - 1.5}" width="18" height="3.5" rx="2" fill="${c}" transform="rotate(${rot} ${px} ${py})"/>`; break;
          case "wedge": s += `<path d="M${px - 7},${py + 4} L${px},${py - 7} L${px + 7},${py + 4}Z" fill="${c}" stroke="#000" stroke-opacity=".08" transform="rotate(${rot} ${px} ${py})"/>`; break;
          case "dollop": if (i < 2) s += `<path d="M${px - 11},${py + 4} q0,-12 11,-12 q11,0 11,12z" fill="${c}"/><circle cx="${px - 3}" cy="${py - 4}" r="2" fill="#fff"/>`; break;
          case "shred": s += `<rect x="${px - 5}" y="${py - 1}" width="10" height="2.2" rx="1" fill="${c}" transform="rotate(${rot} ${px} ${py})"/>`; break;
          case "coin": case "ring": s += `<circle cx="${px}" cy="${py}" r="4.2" fill="${x.a.shape === "ring" ? "none" : c}" stroke="${c}" stroke-width="${x.a.shape === "ring" ? 1.8 : 0}"/>`; break;
          case "drizzle": if (i < 2) s += `<path d="M${px - 20},${py} q6,-8 12,0 t12,0 t12,0" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>`; break;
          case "mash": s += `<circle cx="${px}" cy="${py}" r="${3 + rnd() * 3}" fill="${c}" opacity=".85"/>`; break;
          default: s += `<circle cx="${px}" cy="${py}" r="3" fill="${c}"/>`;
        }
      }
    });
  }
  return s + "</svg>";
}
const withTitle = (arr, title) => Object.assign(arr, { title });
const curatedArt = (r) => recipeArt(r.id, withTitle([...r.ing], r.name), RECIPES.indexOf(r));
const myArt = (r, i) => recipeArt(r.id, withTitle((r.ingredients || []).map((x) => [x.name, x.g]), r.name), i + 2);
function recipeCard(r, art, kcal, sub, attrs) {
  return `<button class="card rc" ${attrs}><div class="rimg">${art}</div><div class="rbody"><div class="rname">${esc(r.name)}</div><div class="row wrap" style="gap:5px"><span class="chip">${fmt(kcal)} kcal</span>${sub}</div></div></button>`;
}
function viewMeals() {
  const cats = ["All", ...new Set(RECIPES.flatMap((r) => r.cats))];
  const list = RECIPES.filter((r) => UI.mealCat === "All" || r.cats.includes(UI.mealCat));
  const mine = lib().recipes;
  return `${topbar("Meal Inspiration")}<main class="stack">
    <div class="tabs scroll" role="tablist" aria-label="Recipe categories">${cats.map((c) => `<button role="tab" aria-selected="${UI.mealCat === c}" class="${UI.mealCat === c ? "on" : ""}" data-a="mealCat" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="rgrid">${list.map((r) => { const n = recipeTotals(r), per = 1 / r.serves; return recipeCard(r, curatedArt(r), n.kcal * per, isHighProtein({ kcal: n.kcal, p: n.p }) ? `<span class="chip pine">High protein</span>` : `<span class="chip">${r.mins} min</span>`, `data-a="sheet" data-v="recipeView" data-id="${r.id}"`); }).join("")}</div>
    <div class="section-title"><h2>My recipes</h2><button class="btn sm" data-a="sheet" data-v="recipeEdit">${ic("plus")} Create</button></div>
    ${mine.length ? `<div class="rgrid">${mine.map((r, i) => { const n = recipeTotals(r), sv = r.mode === "equal" ? r.servings || 1 : 1; return recipeCard(r, myArt(r, i), n.kcal / sv, r.draft ? `<span class="chip warn">Draft</span>` : `<span class="chip">${r.mode === "equal" ? "per serving" : r.mode === "custom" ? "whole recipe" : "1 serving"}</span>`, `data-a="sheet" data-v="recipeEdit" data-id="${r.id}"`); }).join("")}</div>` : `<div class="card empty"><strong>Add your first recipe</strong><span class="small">Save meals you cook so you can log a portion in a few taps.</span></div>`}
  </main>`;
}
// recipe detail gets its picture too
const _rvBody = SH.recipeView.body;
SH.recipeView.body = (s) => `<div class="rimg big">${curatedArt(RECIPES.find((x) => x.id === s.id))}</div>` + _rvBody(s);

/* start once every module above has loaded */
start();

</script>
