plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.myklharu.stride'
    compileSdk 36

    defaultConfig {
        applicationId "com.myklharu.stride"
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // A fixed signing key means each new build installs over the old one and keeps your data.
    signingConfigs {
        stride {
            storeFile file('stride.keystore')
            storePassword 'stride-app'
            keyAlias 'stride'
            keyPassword 'stride-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stride
        }
        debug {
            signingConfig signingConfigs.stride
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Keeps the Kotlin libraries pulled in by Google's scanner on one version
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.0.21')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
