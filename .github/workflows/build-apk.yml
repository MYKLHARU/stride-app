name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Add the offline UK food database (if one has been built)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/offdb
          if gh release download food-db -p food-db.zip -D /tmp/fdb; then
            unzip -q -o /tmp/fdb/food-db.zip -d app/src/main/assets/offdb
            cat app/src/main/assets/offdb/meta.json
          else
            echo "No food database release yet; building without it."
          fi

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Stride.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stride-apk
          path: Stride.apk

      - name: Publish the APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Stride.apk \
            --target "${{ github.sha }}" \
            --title "Stride (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap Stride.apk to download it, then open the file to install. New builds install over the old one and keep your data." \
            --latest
